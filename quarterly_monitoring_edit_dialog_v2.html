<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{年}の編集</title>
<style>
  :root {
    --qm-primary: #1aa97a;
    --qm-primary-dark: #149068;
    --qm-text: #1f2937;
    --qm-text-sub: #4b5563;
    --qm-border: #d1d5db;
    --qm-border-light: #e5e7eb;
    --qm-bg: #f5f6f7;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--qm-bg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    color: var(--qm-text);
    font-size: 14px;
  }

  .qm-page {
    min-height: 100vh;
    padding: 40px 20px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }

  /* ---- ダイアログ ---- */
  .qm-dialog {
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.10);
    width: 100%;
    max-width: 720px;
    overflow: hidden;
  }

  /* ---- ヘッダー ---- */
  .qm-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 28px;
    border-bottom: 1px solid var(--qm-border-light);
  }
  .qm-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--qm-text);
    margin: 0;
  }
  .qm-close {
    background: transparent;
    border: none;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    color: var(--qm-text-sub);
    padding: 6px 10px;
    border-radius: 6px;
    font-family: inherit;
    transition: background 0.15s;
  }
  .qm-close:hover { background: #f3f4f6; }

  /* ---- 本文 ---- */
  .qm-body {
    padding: 8px 28px 20px;
    max-height: 70vh;
    overflow-y: auto;
  }

  /* ---- 財務項目アコーディオン ---- */
  .qm-item {
    border: 1px solid var(--qm-border-light);
    border-radius: 8px;
    margin-top: 16px;
    overflow: hidden;
    background: #fff;
  }
  .qm-item-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    cursor: pointer;
    background: #fafbfc;
    transition: background 0.15s;
    user-select: none;
  }
  .qm-item-header:hover { background: #f3f5f7; }
  .qm-item-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 15px;
    font-weight: 700;
    color: var(--qm-text);
  }
  .qm-item-bar {
    width: 5px;
    height: 18px;
    background: var(--qm-primary);
    border-radius: 2px;
    flex-shrink: 0;
  }
  .qm-item-summary {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 12px;
    color: #6b7280;
  }
  .qm-item-summary .qm-achievement {
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
    background: #f3f4f6;
    color: #4b5563;
  }
  .qm-item-summary .qm-achievement.ok { background: #e7f6ef; color: var(--qm-primary-dark); }
  .qm-item-summary .qm-achievement.warn { background: #fef3c7; color: #92400e; }
  .qm-chevron {
    width: 18px; height: 18px;
    color: #9ca3af;
    transition: transform 0.2s;
  }
  .qm-item.is-open .qm-chevron { transform: rotate(180deg); }

  .qm-item-body {
    display: none;
    padding: 8px 22px 22px;
    border-top: 1px solid var(--qm-border-light);
  }
  .qm-item.is-open .qm-item-body { display: block; }

  /* ---- 四半期見出し ---- */
  .qm-quarter {
    margin-top: 18px;
  }
  .qm-quarter:first-child { margin-top: 8px; }
  .qm-quarter-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 700;
    color: var(--qm-text);
    margin: 0 0 10px;
  }
  .qm-quarter-bar {
    width: 4px;
    height: 16px;
    background: var(--qm-primary);
    border-radius: 2px;
    flex-shrink: 0;
  }

  /* ---- 入力ペア ---- */
  .qm-fields {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .qm-field-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--qm-text);
    margin-bottom: 6px;
  }
  .qm-input {
    width: 100%;
    height: 42px;
    border-radius: 6px;
    border: 1px solid var(--qm-border);
    background: #fff;
    padding: 0 14px;
    font-size: 14px;
    color: var(--qm-text);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    font-family: inherit;
    font-variant-numeric: tabular-nums;
  }
  .qm-input::placeholder { color: #c2c7cd; }
  .qm-input:focus {
    border-color: var(--qm-primary);
    box-shadow: 0 0 0 3px rgba(26,169,122,0.12);
  }

  /* ---- フッター ---- */
  .qm-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    padding: 16px 28px;
    border-top: 1px solid var(--qm-border-light);
    background: #fff;
  }
  .qm-btn {
    height: 40px;
    padding: 0 22px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.06s, background 0.15s;
    border: 1px solid transparent;
    font-family: inherit;
  }
  .qm-btn:active { transform: translateY(1px); }
  .qm-btn-cancel {
    background: #fff;
    color: var(--qm-text);
    border-color: var(--qm-border);
  }
  .qm-btn-cancel:hover { background: #f9fafb; }
  .qm-btn-save {
    background: var(--qm-primary);
    color: #fff;
  }
  .qm-btn-save:hover { background: var(--qm-primary-dark); }

  /* ---- レスポンシブ ---- */
  @media (max-width: 600px) {
    .qm-header, .qm-body, .qm-footer { padding-left: 16px; padding-right: 16px; }
    .qm-fields { grid-template-columns: 1fr; gap: 10px; }
    .qm-item-summary { display: none; }
    .qm-item-body { padding: 8px 14px 18px; }
  }
</style>
</head>
<body>
<div class="qm-page">
  <div class="qm-dialog" role="dialog" aria-labelledby="qm-title-text">

    <!-- ヘッダー -->
    <div class="qm-header">
      <h2 class="qm-title" id="qm-title-text">2026年の編集</h2>
      <button class="qm-close" type="button" aria-label="閉じる">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
          <path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        閉じる
      </button>
    </div>

    <!-- 本文（アコーディオン） -->
    <div class="qm-body" id="qm-body"><!-- JSで生成 --></div>

    <!-- フッター -->
    <div class="qm-footer">
      <button class="qm-btn qm-btn-cancel" type="button">キャンセル</button>
      <button class="qm-btn qm-btn-save" type="button" id="qm-save">登録する</button>
    </div>
  </div>
</div>

<script>
(function(){
  var items = [
    { key: 'sales',        label: '売上高' },
    { key: 'gross_profit', label: '売上総利益' },
    { key: 'op_profit',    label: '営業利益' },
    { key: 'net_profit',   label: '計上利益' }
  ];
  var quarters = [
    { key: 'q1', label: '第一四半期' },
    { key: 'q2', label: '第二四半期' },
    { key: 'q3', label: '第三四半期' },
    { key: 'q4', label: '第四四半期' }
  ];

  // 数値フォーマット
  function formatNum(v) {
    if (v === '' || v === null || v === undefined) return '';
    var n = parseInt(String(v).replace(/[^\d-]/g, ''), 10);
    if (isNaN(n)) return '';
    return n.toLocaleString('ja-JP');
  }

  // アコーディオン生成
  var body = document.getElementById('qm-body');
  var html = '';
  items.forEach(function(it, idx){
    var quartersHtml = '';
    quarters.forEach(function(q){
      quartersHtml += '' +
        '<div class="qm-quarter">' +
          '<h4 class="qm-quarter-title"><span class="qm-quarter-bar"></span>' + q.label + '</h4>' +
          '<div class="qm-fields">' +
            '<div>' +
              '<label class="qm-field-label" for="qm-' + it.key + '-' + q.key + '-target">目標（千円）</label>' +
              '<input id="qm-' + it.key + '-' + q.key + '-target" class="qm-input" type="text" inputmode="numeric" placeholder="目標を入力" ' +
                'data-item="' + it.key + '" data-q="' + q.key + '" data-kind="target">' +
            '</div>' +
            '<div>' +
              '<label class="qm-field-label" for="qm-' + it.key + '-' + q.key + '-actual">実績（千円）</label>' +
              '<input id="qm-' + it.key + '-' + q.key + '-actual" class="qm-input" type="text" inputmode="numeric" placeholder="実績を入力" ' +
                'data-item="' + it.key + '" data-q="' + q.key + '" data-kind="actual">' +
            '</div>' +
          '</div>' +
        '</div>';
    });

    html += '' +
      '<div class="qm-item' + (idx === 0 ? ' is-open' : '') + '" data-item="' + it.key + '">' +
        '<div class="qm-item-header" role="button" tabindex="0" aria-expanded="' + (idx === 0 ? 'true' : 'false') + '">' +
          '<div class="qm-item-title">' +
            '<span class="qm-item-bar"></span>' + it.label +
          '</div>' +
          '<div style="display:flex;align-items:center;gap:14px;">' +
            '<div class="qm-item-summary">' +
              '<span class="qm-achievement" data-summary>未入力</span>' +
            '</div>' +
            '<svg class="qm-chevron" viewBox="0 0 20 20" fill="none">' +
              '<path d="M5 8l5 5 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
            '</svg>' +
          '</div>' +
        '</div>' +
        '<div class="qm-item-body">' + quartersHtml + '</div>' +
      '</div>';
  });
  body.innerHTML = html;

  // アコーディオン開閉
  body.querySelectorAll('.qm-item-header').forEach(function(h){
    function toggle() {
      var item = h.closest('.qm-item');
      item.classList.toggle('is-open');
      h.setAttribute('aria-expanded', item.classList.contains('is-open') ? 'true' : 'false');
    }
    h.addEventListener('click', toggle);
    h.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
  });

  // 数値整形 + サマリ更新
  function updateSummary(itemKey) {
    var item = body.querySelector('.qm-item[data-item="' + itemKey + '"]');
    if (!item) return;
    var targetSum = 0, actualSum = 0, hasInput = false;
    item.querySelectorAll('input.qm-input').forEach(function(el){
      var v = parseInt(String(el.value).replace(/[^\d-]/g, ''), 10);
      if (!isNaN(v)) {
        hasInput = true;
        if (el.dataset.kind === 'target') targetSum += v;
        else actualSum += v;
      }
    });
    var summary = item.querySelector('[data-summary]');
    if (!hasInput) {
      summary.textContent = '未入力';
      summary.className = 'qm-achievement';
      return;
    }
    if (targetSum > 0) {
      var rate = Math.round((actualSum / targetSum) * 100);
      summary.textContent = '達成率 ' + rate + '%';
      summary.className = 'qm-achievement ' + (rate >= 100 ? 'ok' : (rate >= 70 ? 'warn' : ''));
    } else {
      summary.textContent = '実績 ' + actualSum.toLocaleString('ja-JP') + ' 千円';
      summary.className = 'qm-achievement';
    }
  }

  body.querySelectorAll('input.qm-input').forEach(function(el){
    el.addEventListener('input', function(){
      // 数値以外を除去
      var caret = el.selectionStart;
      var before = el.value;
      var digitsOnly = before.replace(/[^\d-]/g, '');
      var formatted = digitsOnly === '' ? '' : formatNum(digitsOnly);
      if (before !== formatted) {
        el.value = formatted;
        try {
          var diff = formatted.length - before.length;
          el.setSelectionRange(Math.max(0, caret + diff), Math.max(0, caret + diff));
        } catch(e){}
      }
      updateSummary(el.dataset.item);
    });
  });

  // 保存ボタン
  document.getElementById('qm-save').addEventListener('click', function(){
    var data = { quarters: {} };
    body.querySelectorAll('input.qm-input').forEach(function(el){
      var k = el.dataset.item + '_' + el.dataset.q + '_' + el.dataset.kind;
      data.quarters[k] = el.value.replace(/,/g, '');
    });
    console.log('登録データ:', data);
    var self = this;
    var orig = self.textContent;
    self.textContent = '登録しました';
    setTimeout(function(){ self.textContent = orig; }, 1400);
  });
})();
</script>
</body>
</html>
